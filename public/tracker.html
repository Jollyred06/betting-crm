<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Tracker — Betting CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1117; --card:#1a1d29; --border:#2a2e3d; --text:#e8e9ed; --muted:#8b8fa3; --green:#4ade80; --red:#f87171; --amber:#fbbf24; --accent:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); padding:16px; max-width:720px; margin:0 auto; }
  a { color: var(--accent); }
  h1 { font-size:1.3rem; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:16px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:12px; }
  .btn { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:.85rem; text-decoration:none; cursor:pointer; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  .title { font-size:1rem; font-weight:600; margin-bottom:10px; }
  .verdict { border-left:4px solid var(--muted); }
  .verdict.good { border-left-color:var(--green); } .verdict.bad { border-left-color:var(--red); } .verdict.neutral { border-left-color:var(--amber); } .verdict.wait { border-left-color:var(--accent); }
  .verdict .v-title { font-size:1.05rem; font-weight:700; margin-bottom:4px; }
  .verdict .v-text { color:var(--muted); font-size:.9rem; line-height:1.4; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px; }
  .stat .n { font-size:1.35rem; font-weight:700; } .stat .l { color:var(--muted); font-size:.75rem; margin-top:2px; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  .bar { height:10px; background:var(--bg); border:1px solid var(--border); border-radius:6px; overflow:hidden; margin:8px 0 4px; }
  .bar > div { height:100%; background:var(--accent); }
  .muted { color:var(--muted); font-size:.8rem; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tab { flex:1; text-align:center; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--muted); font-size:.85rem; cursor:pointer; }
  .tab.on { color:var(--text); border-color:var(--accent); }
  .sig { border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; }
  .sig .t { font-weight:600; margin-bottom:2px; } .sig .m { font-size:.8rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 10px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:6px; font-size:.72rem; font-weight:600; }
  .pill.pending { background:#3b3f52; color:var(--muted); } .pill.won { background:#14532d; color:var(--green); } .pill.lost { background:#4c1d1d; color:var(--red); }
  .sched { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:.88rem; } .sched:last-child { border-bottom:0; }
  .log { font-family:ui-monospace,Menlo,monospace; font-size:.74rem; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .log .signal { color:var(--green); } .log .warn { color:var(--amber); } .log .saving { color:var(--accent); } .log .info { color:var(--muted); }
  details summary { cursor:pointer; font-weight:600; }
  .empty { color:var(--muted); font-size:.9rem; padding:8px 0; }
</style>
</head>
<body>
  <div class="top">
    <div><h1>Tracker</h1><div class="sub">Strategia A: migliore quota contro Pinnacle. Senza soldi veri.</div></div>
    <div style="display:flex; gap:6px;"><a class="btn" href="/dashboard.html">Dashboard</a><button class="btn" onclick="load()">Aggiorna</button></div>
  </div>

  <div id="verdict" class="card verdict wait"><div class="v-title">Caricamento…</div></div>

  <div class="card">
    <div class="title">Riepilogo</div>
    <div id="stats" class="grid"></div>
    <div class="bar"><div id="bar" style="width:0%"></div></div>
    <div id="barText" class="muted"></div>
    <div id="strongLine" class="muted" style="margin-top:8px;"></div>
  </div>

  <div class="card">
    <div class="title">Segnali</div>
    <div class="tabs">
      <div class="tab on" data-s="" onclick="setTab(this)">Tutti</div>
      <div class="tab" data-s="pending" onclick="setTab(this)">In attesa</div>
      <div class="tab" data-s="settled" onclick="setTab(this)">Chiusi</div>
    </div>
    <div id="signals"></div>
  </div>

  <div class="card">
    <div class="title">Prossime partite per campionato</div>
    <div class="muted" style="margin-bottom:6px;">Campionati seguiti tramite quote. Gli altri arrivano dalle partite del giorno.</div>
    <div id="schedule"></div>
  </div>

  <div class="card">
    <div class="title">Ultimo giro</div>
    <div id="run"></div>
    <details style="margin-top:10px;"><summary>Mostra il log completo</summary><div id="log" class="log" style="margin-top:8px;"></div></details>
  </div>

<script>
  let tab = '';
  const fmtDate = d => d ? new Date(d).toLocaleString('it-IT', { weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
  const pct = (v, d = 1, sign = true) => v === null || v === undefined ? '—' : (sign && v >= 0 ? '+' : '') + Number(v).toFixed(d) + '%';
  const cls = v => v === null || v === undefined ? '' : (v >= 0 ? 'pos' : 'neg');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  function setTab(el) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('on')); el.classList.add('on'); tab = el.dataset.s; loadSignals(); }

  async function loadSignals() {
    const el = document.getElementById('signals');
    try {
      const rows = await (await fetch('/api/tracker/signals' + (tab ? '?status=' + tab : ''))).json();
      if (!Array.isArray(rows)) throw new Error(rows.error || 'errore');
      if (!rows.length) { el.innerHTML = '<div class="empty">Nessun segnale in questa lista.</div>'; return; }
      el.innerHTML = rows.map(r => `
        <div class="sig">
          <div class="t">${esc(r.home)} – ${esc(r.away)}</div>
          <div class="m"><span>${esc(r.leagueName)}</span><span>${fmtDate(r.kickoff)}</span></div>
          <div style="margin:6px 0;">Punta su <b>${esc(r.pick)}</b> a <b>${r.odd.toFixed(2)}</b> <span class="muted">(${esc(r.bookmaker || 'n/d')})</span></div>
          <div class="m"><span class="pill ${r.status}">${r.status === 'pending' ? 'in attesa' : r.status === 'won' ? 'vinta ' + esc(r.score || '') : 'persa ' + esc(r.score || '')}</span>
            <span>vantaggio stimato ${pct(r.edgePct)}</span>
            ${r.clvPct !== null ? `<span class="${cls(r.clvPct)}">vs chiusura ${pct(r.clvPct, 1)}</span>` : ''}</div>
        </div>`).join('');
    } catch (e) { el.innerHTML = '<div class="empty">Non riesco a caricare i segnali: ' + esc(e.message) + '</div>'; }
  }

  async function load() {
    try {
      const d = await (await fetch('/api/tracker/overview')).json();
      if (d.error) throw new Error(d.error);
      const v = document.getElementById('verdict');
      v.className = 'card verdict ' + d.verdict.level;
      v.innerHTML = `<div class="v-title">${esc(d.verdict.title)}</div><div class="v-text">${esc(d.verdict.text)}</div>`;
      const t = d.total;
      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="n">${t.signals}</div><div class="l">Segnali totali</div></div>
        <div class="stat"><div class="n">${t.settled}</div><div class="l">Chiusi (${t.pending} in attesa)</div></div>
        <div class="stat"><div class="n ${cls(t.avgClvPct)}">${pct(t.avgClvPct, 2)}</div><div class="l">Valore medio vs chiusura${t.clvCi95 ? ` (${pct(t.clvCi95[0], 1)} / ${pct(t.clvCi95[1], 1)})` : ''}</div></div>
        <div class="stat"><div class="n ${cls(t.roiFlatPct)}">${pct(t.roiFlatPct, 1)}</div><div class="l">ROI a puntata fissa</div></div>
        <div class="stat"><div class="n">${t.hitRatePct === null ? '—' : t.hitRatePct.toFixed(0) + '%'}</div><div class="l">Vinte sui chiusi</div></div>
        <div class="stat"><div class="n">${d.week.signals}</div><div class="l">Segnali ultimi 7 giorni</div></div>`;
      document.getElementById('bar').style.width = d.progress.pct + '%';
      document.getElementById('barText').textContent = `${d.progress.settled} su ${d.progress.target} segnali chiusi per una lettura solida (${d.progress.pct}%)`;
      document.getElementById('strongLine').textContent = d.strong && d.strong.signals && d.strong.signals !== t.signals
        ? `Solo segnali con vantaggio >= 3%: ${d.strong.signals} (chiusi ${d.strong.settled}), valore vs chiusura ${pct(d.strong.avgClvPct, 2)}` : '';

      document.getElementById('schedule').innerHTML = d.schedule.length
        ? d.schedule.map(s => `<div class="sched"><span>${esc(s.name)}</span><span class="muted">${fmtDate(s.nextStart)}</span></div>`).join('')
        : '<div class="empty">Non ancora disponibile: compare dopo il primo giro.</div>';

      const r = d.lastRun, runEl = document.getElementById('run'), logEl = document.getElementById('log');
      if (!r) { runEl.innerHTML = '<div class="empty">Nessun giro registrato.</div>'; logEl.innerHTML = ''; }
      else {
        runEl.innerHTML = `<div>${fmtDate(r.at)} — ${r.success ? '<span class="pos">riuscito</span>' : '<span class="neg">errore: ' + esc(r.error) + '</span>'}</div>
          <div class="muted" style="margin-top:4px;">Segnali salvati: ${r.signals ?? 0} · richieste quote: ${r.oddsRequests ?? 0}${r.credits ? ` · crediti rimasti: <b>${r.credits.remaining}</b> su 500` : ''}</div>`;
        logEl.innerHTML = r.lines.map(l => `<div class="${l.kind}">${esc(l.text)}</div>`).join('');
      }
    } catch (e) {
      document.getElementById('verdict').innerHTML = '<div class="v-title">Non riesco a caricare i dati</div><div class="v-text">' + esc(e.message) + ' — se il server era fermo, riprova tra un minuto.</div>';
    }
    loadSignals();
  }
  load();
</script>
</body>
</html>
