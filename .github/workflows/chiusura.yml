name: chiusura-pinnacle
on:
  schedule:
    - cron: '*/10 * * * *'   # 16/11/2026: ogni 10 minuti tiene sveglio Render gratuito (si addormenta dopo 15): niente attese di 40 s, scansioni e chiusure puntuali
  workflow_dispatch:
jobs:
  chiusura:
    runs-on: ubuntu-latest
    steps:
      - name: cattura quote di chiusura
        run: |
          curl -sS --retry 2 --retry-delay 10 --max-time 90 -X POST \
            -H "x-run-key: ${{ secrets.RUN_KEY }}" \
            "https://betting-crm.onrender.com/api/capture-closing"
