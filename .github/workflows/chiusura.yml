name: chiusura-pinnacle
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  chiusura:
    runs-on: ubuntu-latest
    steps:
      - name: cattura quote di chiusura
        run: |
          curl -sS --retry 2 --retry-delay 10 --max-time 90 -X POST \
            -H "x-run-key: ${{ secrets.RUN_SECRET_KEY }}" \
            "https://betting-crm.onrender.com/api/capture-closing"
