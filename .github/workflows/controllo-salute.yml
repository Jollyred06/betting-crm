name: controllo-salute
# Se qualcosa non va (CRM giu', crediti finiti, scansione ferma) il controllo fallisce e GitHub ti manda un'email.
on:
  schedule:
    - cron: '20 11,14,17,20 * * *'
  workflow_dispatch:
jobs:
  salute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/salute.js
